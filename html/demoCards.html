<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Animal Crossing Tinder - Encuentra a tu aldeano ideal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tu CSS -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<main id="game-container">
        
        <div id="bg-top" class="bg-presentation">
            <img src="../imagenes/Logo_Api_Marrón.webp" alt="" class="logo-img-small">
        </div>
        <div id="bg-bottom" class="wood-floor"></div>

        <div id="cardsContainer">
            </div>

        <div class="controls-container">
            <button id="noBtn" class="ac-btn ac-btn-no">
                <i class="fas fa-times"></i>
            </button>
            <button id="matchBtn" class="ac-btn ac-btn-yes">
                <i class="fas fa-heart"></i>
            </button>
        </div>

    </main>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
    <script src="../js/cards.js"></script>
</body>
</html>
