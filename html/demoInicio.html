<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ACRINDER - Find Love</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;400;700&family=Epunda+Slab:wght@300;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;400;700&family=Epunda+Slab:wght@300;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/styles.css">

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

    <!-- Inicio de la Demo -->

    <main id="inicio-demo" class="d-flex flex-column justify-content-center align-items-center vh-100 position-relative">
        <section class="text-center z-1 d-flex flex-column align-items-center gap-5">
           <header class="logo-container d-flex flex-row justify-content-center align-items-center gap-2 mb-5">
                <img src="../imagenes/Logo_Api_Marrón.webp" alt=""
                class="logo-img-big">
                <h1 class="logo-title m-0">ACRINDER</h1> 
           </header>

           <!-- Buttons -->

            <nav class="d-flex flex-column gap-4 align-items-center btn-container">
                <button id="btn-start" class="btn-acrinder d-flex align-items-centre justify-content-center gap-2">
                    <i class="bi bi-play-fill fs-3 position-absolute start-0 ms-3"></i>
                    <span>Start</span>
                </button>
                <button id="btn-exit" class="btn-acrinder d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-x-lg fs-3 position-absolute start-0 ms-3"></i>
                    <span>Exit</span>
                </button>
           </nav>
           

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- GSAP core + Draggable plugin -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
