<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ACRINDER - Find Love</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;400;700&family=Epunda+Slab:wght@300;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;400;700&family=Epunda+Slab:wght@300;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/styles.css">

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="info-bg">

   <main class="container-fluid vh-100 d-flex align-items-center justify-content-center p-4 overflow-hidden" id="info-screen">
        
        <div class="row w-100 max-w-5xl justify-content-center align-items-stretch gap-4 gap-md-5">
            
            <div class="col-12 col-md-5 left-card d-flex flex-column align-items-center p-4">
                
                <header class="d-flex align-items-center gap-2 mb-3">
                    <img src="../imagenes/Logo_Api_Marrón.webp" alt="Logo" class="info-logo-img">
                    <h1 class="info-logo-title m-0">ACRINDER</h1>
                </header>

                <div class="pink-image-box w-100 d-flex justify-content-center align-items-end mb-4 position-relative">
                    <img id="info-img" src="" alt="Aldeano" class="villager-portrait">
                </div>

                <button id="btn-date" class="btn-date w-100" style="background-image: url('../imagenes/CuadroTextoRosa.webp'); background-size: contain; background-position: center; background-repeat: no-repeat; border: none; background-color: transparent; box-shadow: none; display: flex; align-items: center; justify-content: center; min-height: 80px;">
                   DATE !!!
                </button>
            </div>

            <div class="col-12 col-md-5 right-card p-4 p-md-5 position-relative">
                
                <button id="btn-close" class="btn-close-yellow position-absolute">
                    <i class="bi bi-x-lg"></i>
                </button>

                <h2 class="personality-title m-0">Personality</h2>
                <hr class="title-divider mb-4">
                
                <ul class="stats-list list-unstyled d-flex flex-column gap-3 m-0">
                    <li><i class="bi bi-tree-fill stat-icon" style="color: #28a745;"></i> <strong>Name:</strong> <span id="info-name">...</span></li>
                    <li><i class="bi bi-activity stat-icon" style="color: #6c757d;"></i> <strong>Specie:</strong> <span id="info-species">...</span></li>
                    <li><i class="bi bi-gender-ambiguous stat-icon" style="color: #8c52ff;"></i> <strong>Gender:</strong> <span id="info-gender">...</span></li>
                    <li><i class="bi bi-coin stat-icon" style="color: #ffc107;"></i> <strong>Personality:</strong> <span id="info-personality">...</span></li>
                    <li><i class="bi bi-star-fill stat-icon" style="color: #ffc107;"></i> <strong>Zodiac sign:</strong> <span id="info-sign">...</span></li>
                    <li><i class="bi bi-gift-fill stat-icon" style="color: #dc3545;"></i> <strong>Birthday:</strong> <span id="info-birthday">...</span></li>
                </ul>
            </div>

        </div>
    </main>

     <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
    <script src="../js/info.js"></script>

</body>
</html>
