<head>

</head>

<body class="SeleccionarPerfil">
    <header>
        <nav class="landing-navbar-P">

            <!-- MENÚ ESCRITORIO -->
            <div class="desktop-menu d-none d-lg-flex">

                <div class="menu-box">
                    <a href="../index.html#acrinder" class="landing-link">

                        <img src="../imagenes/Logo_Api_Marrón.webp" alt="Logo" class="logo-leaf">

                        <span>ACRINDER</span>

                    </a>
                </div>

                <div class="menu-box">
                    <a href="../index.html#about" class="landing-link">
                        ABOUT
                    </a>
                </div>

                <div class="menu-box">
                    <a href="../index.html#location" class="landing-link">
                        LOCATION
                    </a>
                </div>

                <div class="menu-box">
                    <a href="../index.html#date" class="landing-link">
                        MATCH
                    </a>
                </div>

            </div>

            <!-- BOTÓN MÓVIL -->
            <button class="mobile-menu-btn d-lg-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#mobileMenu">

                <img src="../imagenes/Logo_Api_Marrón.webp" alt="Logo" class="logo-leaf">
            </button>

            <!-- MENÚ MÓVIL -->
            <div class="collapse mobile-menu" id="mobileMenu">

                <a href="../index.html#acrinder" class="landing-link">
                    ACRINDER
                </a>
                <a href="../index.html#about" class="landing-link">
                    ABOUT
                </a>
                <a href="../index.html#location" class="landing-link">
                    LOCATION
                </a>
                <a href="../index.html#date" class="landing-link">
                    MATCH
                </a>

            </div>

        </nav>

    </header>

    <main class="d-flex flex-column justify-content-center align-items-center">
        <!-- CAJA INFORMATIVA -->
        <div class="caja-bootstrap text-center mt-3 mt-md-5">
            <p class="mb-0">Before picking your future soulmate, we need you to fill your profile.</p>
            <p class="mb-0">What are your pronouns?</p>
        </div>

        <!-- TRES CÍRCULOS CENTRADOS -->
        <div class="container mt-5">
            <div class="row justify-content-center">
                <!-- Los tres círculos pertenecen a una fila, pero cada círculo está dentro de una columna -->

                <!-- CÍRCULO 1: THEY/THEM -->
                <div class="col-12 col-md-4 mb-4 d-flex justify-content-center">
                    <!-- Clase para el GRID / Define el ancho y espacio que ocupa cada elemento en la fila -->
                    <div class="d-flex flex-row flex-md-column align-items-center gap-3 contenedor-circulo">
                        <!-- Clase para el contenido del GRID / Organiza el contenido DENTRO de ese espacio-->

                        <!-- Contenedor para el círculo y la imagen (izquierda en móvil, arriba en escritorio) -->
                        <div
                            class="rounded-circle circulo-pronombre d-flex justify-content-center align-items-center overflow-hidden flex-shrink-0">
                            <img src="../imagenes/They.webp" alt="They" class="img-fluid">
                        </div>

                        <!-- Contenedor para la imagen (cuadro de texto) y el texto superpuesto  (derecha en móvil, abajo en escritorio) -->
                        <div class="position-relative w-100 contenedor-click">
                            <img src="../imagenes/CuadroTextoPequeño.webp" alt="Texto" class="w-100">
                            <div class="position-absolute top-50 start-50 translate-middle text-nowrap texto-pronombre">
                                They/them
                            </div>
                        </div>
                    </div>
                </div>

                <!-- CÍRCULO 2: SHE/HER -->
                <div class="col-12 col-md-4 d-flex justify-content-center mb-4">
                    <div class="d-flex flex-row flex-md-column align-items-center gap-3 contenedor-circulo">

                        <!-- Contenedor para el círculo y la imagen -->
                        <div
                            class="rounded-circle circulo-pronombre d-flex justify-content-center align-items-center overflow-hidden flex-shrink-0">
                            <img src="../imagenes/She.webp" alt="She" class="img-fluid">
                        </div>

                        <!-- Contenedor para la imagen (cuadro de texto) y el texto superpuesto -->
                        <div class="position-relative w-100 contenedor-click">
                            <img src="../imagenes/CuadroTextoPequeño.webp" alt="Texto" class="w-100">
                            <div class="position-absolute top-50 start-50 translate-middle text-nowrap texto-pronombre">
                                She/her
                            </div>
                        </div>
                    </div>
                </div>

                <!-- CÍRCULO 3: HE/HIM -->
                <div class="col-12 col-md-4 d-flex justify-content-center mb-4">
                    <div class="d-flex flex-row flex-md-column align-items-center gap-3 contenedor-circulo">

                        <!-- Contenedor para el círculo y la imagen -->
                        <div
                            class="rounded-circle circulo-pronombre d-flex justify-content-center align-items-center overflow-hidden flex-shrink-0">
                            <img src="../imagenes/He.webp" alt="He" class="img-fluid">
                        </div>

                        <!-- Contenedor para la imagen (cuadro de texto) y el texto superpuesto -->
                        <div class="position-relative w-100 contenedor-click">
                            <img src="../imagenes/CuadroTextoPequeño.webp" alt="Texto" class="w-100">
                            <div class="position-absolute top-50 start-50 translate-middle text-nowrap texto-pronombre">
                                He/him
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </main>
    <script src="../js/SeleccionarPerfil.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
