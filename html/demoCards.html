<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Animal Crossing Tinder - Encuentra a tu aldeano ideal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tu CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-fluid vh-100 d-flex flex-column justify-content-center align-items-center p-3">
        
        <!-- Header con logo y título -->
        <div class="text-center mb-4">
            <h1 class="display-5 fw-bold text-white mb-2">
                <i class="fas fa-paw text-success"></i> Aldeanimals 
                <i class="fas fa-heart text-danger"></i>
            </h1>
            <p class="text-white-50">Encuentra a tu compañero perfecto en la isla</p>
        </div>

        <!-- Botón Start -->
        <button id="startBtn" class="btn btn-start btn-lg mb-4 px-5 py-3 fw-bold shadow">
            <i class="fas fa-play me-2"></i>Comenzar búsqueda
        </button>

        <!-- Contenedor de las tarjetas -->
        <div class="position-relative" id="cardsContainer" style="width: 340px; height: 520px;">
            <!-- Las tarjetas se insertarán dinámicamente aquí -->
        </div>

        <!-- Botones de acción -->
        <div class="mt-4 d-flex gap-4">
            <button id="noBtn" class="btn btn-no rounded-circle p-3 shadow">
                <i class="fas fa-times fa-2x"></i>
            </button>
            <button id="matchBtn" class="btn btn-match rounded-circle p-3 shadow">
                <i class="fas fa-heart fa-2x"></i>
            </button>
        </div>
        
        <small class="text-white-50 mt-3">
            <i class="fas fa-arrow-left me-2"></i>Desliza izquierda para RECHAZAR 
            <i class="fas fa-arrow-right ms-3 me-2"></i>Desliza derecha para ACEPTAR
        </small>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
    <script src="demo.js"></script>
</body>
</html>
